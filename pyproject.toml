requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.26.1",
    "matplotlib>=3.9",
    "numpy>=2.5.2",
    "pydantic>=2.13.4",
    "pytest==9.0.3",
    "safetensors>=0.8.0",
    "tiktoken>=0.13.0",
    "torch>=2.12.1",
    "tqdm>=4.70.0",
    "transformers==5.19.0",
]

[dependency-groups]
dev = [
    "modal>=1.5.4",
    "mypy>=2.1.0",
    "ruff>=0.15.14",
    "types-tqdm>=4.70.0.20260805",
]
